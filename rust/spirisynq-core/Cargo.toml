[package]
name = "spirisynq-core"
version = "0.1.0"
description = "The SpiriSynq engine: authoritative objects, mirrors and remote calls, independent of any transport"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.22"
serde_json = { version = "1", features = ["preserve_order"] }
spirisynq-schema = { path = "../spirisynq-schema" }
spirisynq-yaml = { path = "../spirisynq-yaml" }

[dev-dependencies]
serde_json = "1"
