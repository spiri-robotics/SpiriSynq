[project]
name = "SpiriSynq"
version = "1.0.0rc1"
description = "Keeps Python dataclass instances in sync across processes, machines and languages over Zenoh"
readme = "README.md"
requires-python = ">=3.13"
authors = [{name = "Spiri Robotics"}]
license = "MIT"
dependencies = [
    "click>=8.3.3",
    "loguru>=0.7.3",
    "psygnal>=0.15.1",
    "rich>=14.3.3",
    "typer>=0.24.1",
]

[project.scripts]
synq = "SpiriSynq.cli:app"
spirisynq = "SpiriSynq.cli:app"

[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

# The Rust engine is built into the package as SpiriSynq._core.
[tool.maturin]
python-source = "src"
module-name = "SpiriSynq._core"
manifest-path = "rust/spirisynq-python/Cargo.toml"
features = ["pyo3/extension-module"]

[tool.uv]
# Without this, `uv run sphinx-build` in a fresh clone fails to find Sphinx: uv
# installs only the `dev` group unless told otherwise.
default-groups = ["dev", "docs"]
# Rebuild the extension when the Rust sources change.
cache-keys = [{file = "pyproject.toml"}, {file = "rust/Cargo.lock"}, {file = "rust/*/src/**/*.rs"}, {file = "rust/*/Cargo.toml"}, {file = "rust/Cargo.toml"}]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
concurrency = ["thread"]
# The completion server runs as its own process: measure it too.
patch = ["subprocess"]

[tool.ruff]
line-length = 100
# Code samples in the docs are fragments (a method shown indented, as in its class), which the
# formatter would rewrite as module code.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
# N999: the package is named like the repo (SpiriGateway, SpiriCamera).
# B008: typer's idiom. SIM117: nested `with` blocks are how NiceGUI lays out a page.
ignore = ["N999", "B008", "SIM117"]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "objgraph>=3.6.2",
    "pytest>=9.2.0",
    "pytest-benchmark>=5.2.3",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0",
    "ruff>=0.17.3",
]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=5.1.0",
    "sphinx>=9.2.0",
    # Document control, PDF footer and naming, safety panels: the same extension
    # every Spiri manual uses. https://github.com/spiri-robotics/spiri-docs-tooling
    "spiri-docs>=0.2.0",
]
examples = [
    "imagecodecs>=2026.3.6",
    "nicegui>=3.9.0",
    "opencv-python-headless>=4.13.0.92",
]
